apiVersion: batch/v1
kind: CronJob
metadata:
  name: figure-scraper-cron
  namespace: default
spec:
  # Run once every 2 days at midnight
  # Format: minute hour day month weekday
  # "0 0 */2 * *" - Every 2 days at midnight
  schedule: "0 0 */2 * *"
  
  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  # Prevent concurrent runs
  concurrencyPolicy: Forbid
  
  # Job will be marked as failed if it takes longer than 12 hours
  startingDeadlineSeconds: 43200
  
  jobTemplate:
    spec:
      # Job will be deleted after 24 hours
      ttlSecondsAfterFinished: 86400
      
      # Retry failed jobs up to 2 times
      backoffLimit: 2
      
      template:
        metadata:
          labels:
            app: figure-scraper
            job-type: cron-scrape
        spec:
          restartPolicy: OnFailure
          
          # Share process namespace so proxy can detect when main container exits
          shareProcessNamespace: true
          
          volumes:
            - name: cloudsql-instance-credentials
              secret:
                secretName: cloudsql-creds
            - name: shared-data
              emptyDir: {}
          
          containers:
          # Cloud SQL Proxy sidecar
          - name: cloudsql-proxy
            image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.16.0-alpine
            command:
              - "/bin/sh"
              - "-c"
              - |
                /cloud-sql-proxy reciept-scanner-431421:us-central1:figure-sql --credentials-file=/secrets/cloudsql/credentials.json &
                PROXY_PID=$!
                while true; do
                  if [ -f /shared/scraper-done ]; then
                    echo "Scraper finished, shutting down proxy..."
                    kill $PROXY_PID
                    exit 0
                  fi
                  sleep 5
                done
            volumeMounts:
              - name: cloudsql-instance-credentials
                mountPath: /secrets/cloudsql
                readOnly: true
              - name: shared-data
                mountPath: /shared
            resources:
              requests:
                memory: "64Mi"
                cpu: "25m"
              limits:
                memory: "128Mi"
                cpu: "50m"
          
          # Scraper application
          - name: scraper
            image: gcr.io/reciept-scanner-431421/figure-aggregator:latest
            imagePullPolicy: Always
            
            # Run the cron scrape script and signal completion
            # uses a signal file to tell cloud sql to kill itself
            command: ["/bin/sh"]
            args: 
              - "-c"
              - "node public/jobs/cronScrape.js; EXIT_CODE=$?; touch /shared/scraper-done; exit $EXIT_CODE"
            
            volumeMounts:
              - name: shared-data
                mountPath: /shared
            
            # Environment variables for database connection
            env:
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: aggregator-mysql-creds
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: aggregator-mysql-creds
                  key: password
            - name: DB_NAME
              value: "aggregatordb"
            - name: NODE_ENV
              value: "production"
            
            # Resource limits to prevent overconsumption
            resources:
              requests:
                memory: "512Mi"
                cpu: "100m"
              limits:
                memory: "2Gi"
                cpu: "300m"
            
            # Timeout: if script runs longer than 11 hours 50 minutes, kill it
            # (leaves 10 min buffer before startingDeadlineSeconds)
            lifecycle:
              preStop:
                exec:
                  command: ["sh", "-c", "sleep 5"]
