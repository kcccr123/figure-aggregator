apiVersion: v1
kind: Secret
metadata:
  name: aggregator-mysql-creds
  namespace: default
type: Opaque
stringData:
  # Database credentials for MySQL
  # These should match your Cloud SQL instance credentials
  username: "YOUR_DB_USER"
  password: "YOUR_DB_PASSWORD"
---
# Note: This secret is referenced by both:
# - deployment.yaml (main backend API)
# - cronjob-scrape.yaml (scheduled scraper)
#
# The cloudsql-creds secret (for Cloud SQL Proxy) should be created separately:
# kubectl create secret generic cloudsql-creds \
#   --from-file=credentials.json=PATH_TO_SERVICE_ACCOUNT_KEY.json
#
# Cloud SQL Connection Info:
# - Instance: reciept-scanner-431421:us-central1:figure-sql
# - Database: aggregatordb
# - Connection: via Cloud SQL Proxy (127.0.0.1)
